amplitude_parameter:
  AMP_START: 0.01
  AMP_STOP: 0.15
  AMP_STEP: 0.04
  OXY_Boost: -0.15
  EU_Boost: 0.10


severity_parameter:
  grade_1: 0.5     # almost clear — Δa* increment
  grade_2: 1.0     # mild
  grade_3: 1.5     # moderate
  grade_4: 2.5     # severe


# ===========================================================================
# BRUISE (contusion) — Run H open-loop monotonicity sweep
# ---------------------------------------------------------------------------
# Recipe: Vb swept UP (severity driver) + phi_h held at a FIXED POSITIVE offset
# (toward deoxygenated). phi_m is NOT edited (no red-hue correction for a bruise).
# SIGN NOTE: erythema used OXY_Boost: -0.15 (toward oxygenated/red); bruise is the
# OPPOSITE — PHI_H offsets are POSITIVE (toward deoxygenated/purple-blue).
# ===========================================================================
bruise_parameter:
  VB_AMP_START: 0.01
  VB_AMP_STOP: 0.20
  VB_AMP_STEP: 0.01
  PHI_H_OFFSETS: [0.0, 0.15, 0.30]   # fixed deoxygenation per row; 0.0 = pure-Vb control
  MONO_TOL: 0.001                    # tolerance for "non-decreasing" dE00
  OUT_CSV: "run_h_bruise_sweep.csv"
  MASK_KEY: "mask_cen"               # which paths:* mask Run H uses (shape-invariant here)
  FACE_LIST: null                    # TODO: path to the 20-face quadrant set (CSV/txt of IDs),
                                     #       or leave null and subset ALBEDO_DIR in load_faces()

